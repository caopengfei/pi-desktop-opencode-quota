<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode Quota</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="head">
        <h1 id="title">OpenCode Quota</h1>
        <div class="head-actions">
          <span id="updated" class="updated"></span>
          <button id="refresh" class="refresh" type="button" title="Refresh">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path
                d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3.2h-3.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span id="refreshLabel">Refresh</span>
          </button>
        </div>
      </header>

      <!-- One row per quota window; panel.js fills this. -->
      <section id="meters" class="meters" hidden></section>

      <section id="notice" class="notice" hidden>
        <p id="noticeTitle" class="notice-title"></p>
        <p id="noticeBody" class="notice-body"></p>
      </section>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
